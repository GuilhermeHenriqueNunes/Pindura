spring.application.name=Pindura

# Configurações de Conexão com o MySQL
# Lidas de variáveis de ambiente (nunca commitar credenciais reais aqui, repositório é público).
# DB_URL e DB_USERNAME têm um valor padrão para facilitar o dev local; DB_PASSWORD não tem
# padrão de propósito, então se a variável não existir a aplicação falha ao subir em vez de
# usar uma senha em branco silenciosamente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pindura_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
