<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindura - Despesas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar('despesas')}"></div>
<div th:replace="~{fragments/layout :: mobileSidebar('despesas')}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <main class="page-content">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <section class="page-header d-flex flex-wrap align-items-end justify-content-between gap-3">
            <div>
                <div class="page-kicker">República Pindura</div>
                <h1 class="page-title">Despesas</h1>
                <p class="page-subtitle">Registre e organize as contas compartilhadas.</p>
            </div>
            <a th:href="@{/despesas/novo}" class="btn btn-pindura px-4">
                <i class="bi bi-plus-lg me-2"></i>Nova despesa
            </a>
        </section>

        <section class="surface-card filter-card mb-4">
            <form method="get" th:action="@{/despesas}" class="row g-2 align-items-center">
                <div class="col-xl-5 col-lg-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" name="pesquisa" class="form-control" placeholder="Buscar pelo título..." th:value="${pesquisa}">
                    </div>
                </div>
                <div class="col-xl-3 col-lg-3">
                    <select name="ordenarPor" class="form-select">
                        <option value="data" th:selected="${ordenarPor == 'data'}">Ordenar por data</option>
                        <option value="valor" th:selected="${ordenarPor == 'valor'}">Ordenar por valor</option>
                        <option value="titulo" th:selected="${ordenarPor == 'titulo'}">Ordenar por título</option>
                    </select>
                </div>
                <div class="col-xl-2 col-lg-3">
                    <select name="direcao" class="form-select">
                        <option value="desc" th:selected="${direcao == 'desc'}">Decrescente</option>
                        <option value="asc" th:selected="${direcao == 'asc'}">Crescente</option>
                    </select>
                </div>
                <div class="col-xl-2 col-lg-12 d-grid d-sm-flex gap-2">
                    <button type="submit" class="btn btn-outline-pindura flex-grow-1">Filtrar</button>
                    <a th:href="@{/despesas}" class="btn btn-outline-secondary" title="Limpar"><i class="bi bi-x-lg"></i></a>
                </div>
            </form>
        </section>

        <section class="surface-card overflow-hidden">
            <div class="panel-title-row">
                <h2 class="panel-title"><i class="bi bi-receipt"></i> Despesas cadastradas</h2>
                <span class="text-muted small" th:text="${#lists.size(despesas) + ' encontrada(s)'}">0 encontrada(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table pindura-table align-middle">
                    <thead>
                    <tr>
                        <th class="ps-4">Título</th>
                        <th>Data</th>
                        <th>Pagador</th>
                        <th>Participantes</th>
                        <th class="text-end">Valor total</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="despesa : ${despesas}">
                        <td class="ps-4 fw-semibold" th:text="${despesa.titulo}">Mercado</td>
                        <td th:text="${#temporals.format(despesa.data, 'dd/MM/yyyy')}">15/09/2026</td>
                        <td><span class="status-soft orange" th:text="${despesa.pagador.nome}">Marcos</span></td>
                        <td th:text="${#lists.size(despesa.participantes) + ' pessoa(s)'}">3 pessoa(s)</td>
                        <td class="text-end fw-bold" th:text="${#numbers.formatCurrency(despesa.valor)}">R$ 120,00</td>
                        <td class="text-end pe-4 action-cell">
                            <a th:href="@{/despesas/{id}(id=${despesa.id})}" class="btn btn-sm btn-outline-secondary me-1" title="Ver detalhes">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/despesas/{id}/editar(id=${despesa.id})}" class="btn btn-sm btn-outline-warning me-1" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/despesas/{id}/excluir(id=${despesa.id})}" method="post" class="d-inline" onsubmit="return confirm('Tem certeza que deseja excluir esta despesa?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(despesas)}">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="bi bi-receipt-cutoff"></i>
                                Nenhuma despesa encontrada.
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
