<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindura - Moradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar('moradores')}"></div>
<div th:replace="~{fragments/layout :: mobileSidebar('moradores')}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <main class="page-content">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <section class="page-header d-flex flex-wrap align-items-end justify-content-between gap-3">
            <div>
                <div class="page-kicker">República Pindura</div>
                <h1 class="page-title">Moradores</h1>
                <p class="page-subtitle">Pessoas que fazem parte da casa.</p>
            </div>
            <a th:href="@{/moradores/novo}" class="btn btn-pindura px-4">
                <i class="bi bi-plus-lg me-2"></i>Novo morador
            </a>
        </section>

        <section class="surface-card filter-card mb-4">
            <form method="get" th:action="@{/moradores}" class="row g-2 align-items-center">
                <div class="col-lg-7">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" name="pesquisa" class="form-control" placeholder="Buscar pelo nome..." th:value="${pesquisa}">
                    </div>
                </div>
                <div class="col-lg-3">
                    <select name="direcao" class="form-select">
                        <option value="asc" th:selected="${direcao == 'asc'}">Nome (A-Z)</option>
                        <option value="desc" th:selected="${direcao == 'desc'}">Nome (Z-A)</option>
                    </select>
                </div>
                <div class="col-lg-2 d-grid d-sm-flex gap-2">
                    <button type="submit" class="btn btn-outline-pindura flex-grow-1">Buscar</button>
                    <a th:href="@{/moradores}" class="btn btn-outline-secondary" title="Limpar"><i class="bi bi-x-lg"></i></a>
                </div>
            </form>
        </section>

        <section class="surface-card overflow-hidden">
            <div class="panel-title-row">
                <h2 class="panel-title"><i class="bi bi-people"></i> Moradores cadastrados</h2>
                <span class="text-muted small" th:text="${#lists.size(moradores) + ' encontrado(s)'}">0 encontrado(s)</span>
            </div>
            <div class="table-responsive">
                <table class="table pindura-table align-middle">
                    <thead>
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Chave Pix</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="morador : ${moradores}">
                        <td class="ps-4 fw-semibold" th:text="${morador.nome}">Guilherme</td>
                        <td>
                            <span th:if="${morador.chavePix != null and !#strings.isEmpty(morador.chavePix)}" class="status-soft orange">
                                <i class="bi bi-key"></i><span th:text="${morador.chavePix}">guilherme@pix</span>
                            </span>
                            <span th:unless="${morador.chavePix != null and !#strings.isEmpty(morador.chavePix)}" class="text-muted small">Não cadastrada</span>
                        </td>
                        <td class="text-end pe-4 action-cell">
                            <a th:href="@{/moradores/{id}/editar(id=${morador.id})}" class="btn btn-sm btn-outline-warning me-1" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/moradores/{id}/excluir(id=${morador.id})}" method="post" class="d-inline" onsubmit="return confirm('Tem certeza que deseja excluir este morador?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(moradores)}">
                        <td colspan="3">
                            <div class="empty-state">
                                <i class="bi bi-person-x"></i>
                                Nenhum morador encontrado.
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
