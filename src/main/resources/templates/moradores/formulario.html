<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindura - Formulário de Morador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-wallet2"></i> Pindura
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" th:href="@{/moradores}">Moradores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/despesas}">Despesas</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4" style="max-width: 700px;">

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h4 class="card-title fw-bold mb-0 text-primary">
                <i class="bi bi-person-gear me-2"></i>
                <span th:text="${morador.id == null ? 'Novo Morador' : 'Editar Morador'}">Cadastro de Morador</span>
            </h4>
        </div>
        <div class="card-body p-4">

            <!--
                O MoradorController só tem @PostMapping("/moradores") (sem "/salvar").
                O action precisa apontar para @{/moradores}, senão dá 404 ao salvar.
            -->
            <form th:action="@{/moradores}" th:object="${morador}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome Completo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nome" th:field="*{nome}"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" placeholder="Ex: Marcos Silva" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                        O nome do morador é obrigatório.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="chavePix" class="form-label fw-semibold">Chave Pix <span class="text-muted fw-normal">(Opcional)</span></label>
                    <input type="text" class="form-control" id="chavePix" th:field="*{chavePix}" placeholder="CPF, e-mail, telefone ou chave aleatória">
                    <div class="form-text">Utilizada para facilitar o acerto de contas das despesas compartilhadas.</div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/moradores}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4" th:text="${morador.id == null ? 'Salvar Morador' : 'Atualizar Morador'}">Salvar</button>
                </div>
            </form>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
