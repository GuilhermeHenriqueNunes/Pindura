<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${morador.id == null ? 'Pindura - Novo morador' : 'Pindura - Editar morador'}">Pindura - Morador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar('moradores')}"></div>
<div th:replace="~{fragments/layout :: mobileSidebar('moradores')}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <main class="page-content">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a th:href="@{/moradores}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
            <div>
                <div class="page-kicker">Moradores</div>
                <h1 class="page-title fs-2" th:text="${morador.id == null ? 'Novo morador' : 'Editar morador'}">Novo morador</h1>
            </div>
        </div>

        <section class="surface-card form-card" style="max-width: 760px;">
            <form th:action="@{/moradores}" th:object="${morador}" method="post">
                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger pindura-alert" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>Confira os campos marcados antes de salvar.
                </div>

                <input type="hidden" th:field="*{id}">

                <h2 class="form-section-title"><i class="bi bi-person"></i> Dados do morador</h2>

                <div class="mb-4">
                    <label for="nome" class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" placeholder="Ex.: Guilherme Nunes" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">O nome é obrigatório.</div>
                </div>

                <div class="mb-4">
                    <label for="chavePix" class="form-label fw-semibold">Chave Pix <span class="text-muted fw-normal">(opcional)</span></label>
                    <input type="text" id="chavePix" th:field="*{chavePix}" class="form-control" placeholder="CPF, e-mail, telefone ou chave aleatória">
                    <div class="form-text">Ela aparece nos detalhes da despesa para facilitar o acerto.</div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/moradores}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-pindura px-4" th:text="${morador.id == null ? 'Salvar morador' : 'Atualizar morador'}">Salvar morador</button>
                </div>
            </form>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
